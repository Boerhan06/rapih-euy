[package]
name = "rapih_engine"
version = "0.1.0"
edition = "2021"
authors = ["Rapih Euy Team"]
description = "High-performance disk cleaning, organization, and quarantine backend for Rapih Euy"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
sysinfo = "0.33"
